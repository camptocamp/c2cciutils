name: Continuous integration

on:
  pull_request:
  push:
    paths-ignore:
      - 'example-project/**'

permissions:
  actions: write
  contents: write
  id-token: write
  packages: write

env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: camptocamp/initialise-gopass-summon-action@17703c87720ba3766abc90da60b437783b530d93 # v2
        with:
          ci-gpg-private-key: ${{secrets.CI_GPG_PRIVATE_KEY}}
          github-gopass-ci-token: ${{secrets.GOPASS_CI_GITHUB_TOKEN}}
          patterns: pypi docker
        if: env.HAS_SECRETS == 'HAS_SECRETS'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
      - run: python3 -m pip install setuptools==68.0.0 wheel==0.45.1 packaging==25.0
      - run: cd c2cciutils; npm install
      - run: python3 ./setup.py egg_info --no-date bdist_wheel
      - run: python3 -m pip install dist/*.whl
      - run: rm -rf dist build

      - name: Checks
        run: c2cciutils-checks

      - name: Build
        run: make
      - name: Build example
        run: (cd example-project/; GITHUB_REPOSITORY=camptocamp/project make)

      - run: sudo chmod go+rw -R *.egg-info
      - run: pip freeze --all
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: tag-publish-python
        with:
          python-version: '3.11'
          update-environment: false
      - run: ${{ steps.tag-publish-python.outputs.python-path }} -m venv ${HOME}/.tag-publish
      - run: ${HOME}/.tag-publish/bin/pip install tag-publish==1.2.6
      - name: Publish
        run: ${HOME}/.tag-publish/bin/tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.HAS_SECRETS == 'HAS_SECRETS'
      - uses: actions/upload-artifact@v4
        with:
          name: Dist
          path: dist/c2cciutils-1.0-py3-none-any.whl
          retention-days: 1
        if: always()

      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch || true
        if: failure()
      - uses: actions/upload-artifact@v4
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
      - name: Trigger changelog workflow
        uses: actions/github-script@v7
        with:
          script: |-
            if (process.env.GITHUB_REF_TYPE == 'tag') {
                console.log('Trigger changelog');
                await github.rest.repos.createDispatchEvent({
                    owner: 'camptocamp',
                    repo: 'c2cciutils',
                    event_type: 'changelog',
                });
            }
